<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="-100 -100 200 200" style="width:100%;height:100%;display:block;overflow:visible">
  <g>
    <sc-for list="{{ petals }}" as="p" hint-placeholder-count="9">
      <path d="{{ p.d }}" fill="{{ p.fill }}" transform="{{ p.transform }}"></path>
    </sc-for>
    <sc-for list="{{ inner }}" as="p" hint-placeholder-count="0">
      <path d="{{ p.d }}" fill="{{ p.fill }}" transform="{{ p.transform }}"></path>
    </sc-for>
    <sc-for list="{{ rings }}" as="r" hint-placeholder-count="4">
      <ellipse cx="{{ r.cx }}" cy="{{ r.cy }}" rx="{{ r.rx }}" ry="{{ r.ry }}" fill="{{ r.fill }}"></ellipse>
    </sc-for>
  </g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;cfg&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  rng(seed) {
    let t = (seed >>> 0) || 1;
    return () => {
      t += 0x6D2B79F5;
      let r = Math.imul(t ^ t >>> 15, 1 | t);
      r ^= r + Math.imul(r ^ r >>> 7, 61 | r);
      return ((r ^ r >>> 14) >>> 0) / 4294967296;
    };
  }
  // ---- petal silhouettes (rooted at center 0,0; tip up) ----
  pTear(w, l, a) {
    return 'M0 0 C ' + (-w) + ' ' + (-l * .3) + ' ' + (-w * .55 + a * w) + ' ' + (-l * .93) + ' 0 ' + (-l) +
      ' C ' + (w * .55 + a * w) + ' ' + (-l * .93) + ' ' + w + ' ' + (-l * .3) + ' 0 0 Z';
  }
  pCosmos(w, l, a) {
    return 'M0 0 C ' + (-w) + ' ' + (-.32 * l) + ' ' + (-w) + ' ' + (-.78 * l) + ' ' + (-.42 * w) + ' ' + (-.96 * l) +
      ' C ' + (-.22 * w) + ' ' + (-1.05 * l) + ' ' + (-.05 * w) + ' ' + (-.85 * l) + ' 0 ' + (-.88 * l) +
      ' C ' + (.05 * w) + ' ' + (-.85 * l) + ' ' + (.22 * w) + ' ' + (-1.05 * l) + ' ' + (.42 * w) + ' ' + (-.96 * l) +
      ' C ' + w + ' ' + (-.78 * l) + ' ' + w + ' ' + (-.32 * l) + ' 0 0 Z';
  }
  pScallop(w, l, a) {
    return 'M0 0 C ' + (-w) + ' ' + (-.16 * l) + ' ' + (-w * (1 + a * .1)) + ' ' + (-.85 * l) + ' 0 ' + (-l) +
      ' C ' + (w * (1 - a * .1)) + ' ' + (-.85 * l) + ' ' + w + ' ' + (-.16 * l) + ' 0 0 Z';
  }
  pStar(w, l, a) {
    return 'M0 0 L ' + (-w) + ' ' + (-.48 * l) + ' L ' + (a * w * .35) + ' ' + (-l) + ' L ' + w + ' ' + (-.48 * l) + ' Z';
  }
  gen(shape, w, l, a) {
    if (shape === 'cosmos') return this.pCosmos(w, l, a);
    if (shape === 'scallop' || shape === 'round' || shape === 'poppy') return this.pScallop(w, l, a);
    if (shape === 'star') return this.pStar(w, l, a);
    return this.pTear(w, l, a);
  }
  renderVals() {
    const p = this.props.cfg || this.props || {};
    const presets = {
      gerbera: { count: 15, w: 6, len: 44 }, aster: { count: 18, w: 5, len: 45 },
      daisy: { count: 11, w: 10, len: 36 }, cosmos: { count: 8, w: 15, len: 40 },
      scallop: { count: 8, w: 20, len: 30 }, round: { count: 9, w: 17, len: 29 },
      poppy: { count: 6, w: 23, len: 36 }, star: { count: 10, w: 9, len: 42 }, bud: { count: 5, w: 15, len: 34 }
    };
    const shape = p.shape || 'gerbera';
    const pr = presets[shape] || presets.gerbera;
    const count = +(p.petalCount ?? pr.count);
    const w = +(p.petalW ?? pr.w);
    const len = +(p.petalLen ?? pr.len);
    const seed = +(p.seed ?? 7);
    const jitter = p.jitter !== undefined ? +p.jitter : 0.24;
    const cols = p.petalColors || [p.petalColor || '#F06BA8'];
    const budColor = p.budColor || '#C7D65C';
    const budIdx = p.budIndices || null;
    const rand = this.rng(seed);
    const spin = p.spin !== undefined ? +p.spin : (rand() * 44 - 22);
    const petals = [];
    for (let i = 0; i < count; i++) {
      const base = i * 360 / count + spin;
      if (budIdx && budIdx.indexOf(i) >= 0) {
        petals.push({ d: this.pTear(w * .6, len * .42, 0), fill: budColor, transform: 'rotate(' + base + ')' });
        continue;
      }
      const ang = base + (rand() * 2 - 1) * jitter * (360 / count);
      const L = len * (1 + (rand() * 2 - 1) * jitter);
      const W = w * (1 + (rand() * 2 - 1) * jitter * .8);
      const a = (rand() * 2 - 1) * .6;
      petals.push({ d: this.gen(shape, W, L, a), fill: cols[i % cols.length], transform: 'rotate(' + ang + ')' });
    }
    const inner = [];
    if (p.double) {
      const ic = p.innerColors || cols;
      for (let i = 0; i < count; i++) {
        const base = (i + 0.5) * 360 / count + spin;
        const ang = base + (rand() * 2 - 1) * jitter * (360 / count);
        const L = len * .58 * (1 + (rand() * 2 - 1) * jitter);
        const W = w * .82 * (1 + (rand() * 2 - 1) * jitter * .8);
        inner.push({ d: this.gen(shape, W, L, (rand() * 2 - 1) * .6), fill: ic[i % ic.length], transform: 'rotate(' + ang + ')' });
      }
    }
    const ringsC = p.centerColors || ['#7A3F5E', '#F06BA8', '#FFB24D', '#FFE07A'];
    const centerR = +(p.centerR ?? 20);
    const ox = (rand() * 2 - 1) * 4, oy = (rand() * 2 - 1) * 4;
    const rings = ringsC.map((c, idx) => {
      const t = (ringsC.length - idx) / ringsC.length;
      return { cx: ox * idx * .6, cy: oy * idx * .6, rx: centerR * t, ry: centerR * t * (.86 + idx * .03), fill: c };
    });
    return { petals, inner, rings };
  }
}
</script>
</body>
</html>
